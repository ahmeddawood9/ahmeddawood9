name: Refresh profile

on:
  schedule:
    # :23 rather than :00 — GitHub's shared runners are swamped on the hour
    # and scheduled jobs queue. 07:23 UTC is 12:23 PKT.
    - cron: "23 7 * * *"
  workflow_dispatch:          # manual "Run workflow" button
  push:
    paths:
      - "tools/profile/**"    # re-render immediately when you edit the config

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install fonttools==4.53.1 brotli==1.1.0

      - run: python tools/profile/fetch.py
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}

      - run: python tools/profile/render.py

      - name: Commit only if something changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets tools/profile/data
          git diff --cached --quiet || (git commit -m "Refresh profile" && git push)
